<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>Portfolio</title>

    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>

  <body class="bg-light">
    <!-- NAVBAR -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
      <div class="container">
        <!-- Brand -->
        <a class="navbar-brand" href="#"> 📷 </a>

        <!-- Toggle Button -->
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNav"
        >
          <span class="navbar-toggler-icon"></span>
        </button>

        <!-- Nav Items -->
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item">
              <a class="nav-link active" href="#">Home</a>
            </li>

            <li class="nav-item">
              <a class="nav-link" href="#">Portfolio</a>
            </li>

            <li class="nav-item">
              <a class="nav-link" href="#">Contact</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <!-- MAIN CONTAINER (FIXED WIDTH) -->
    <div class="container bg-white p-4">
      <!-- Title -->
      <h4 class="text-center mb-4">Portfolio</h4>

      <!-- PORTFOLIO GRID -->
      <div class="row g-3">
        <!-- Left column images -->
        <div class="col-md-6">
          <div class="row g-3">
            <div class="col-6">
              <img
                src="images/blue-flower-5158746_1280.jpg"
                class="img-fluid"
              />
            </div>

            <div class="col-6">
              <img src="images/Mountains (1).jpg" class="img-fluid" />
            </div>

            <div class="col-6">
              <img src="images/lake-8763490_1280.jpg" class="img-fluid" />
            </div>

            <div class="col-6">
              <img
                src="images/architecture-1868667_1280.jpg"
                class="img-fluid"
              />
            </div>
          </div>
        </div>

        <!-- Right large image -->
        <div class="col-md-6">
          <img src="images/clouds-3353159_1280.jpg" class="img-fluid h-100" />
        </div>

        <!-- Bottom row -->
        <div class="col-md-3">
          <img src="images/plum-2679782_1280.jpg" class="img-fluid" />
        </div>

        <div class="col-md-3">
          <img src="images/snow-7658399_1280.jpg" class="img-fluid" />
        </div>

        <div class="col-md-3">
          <img src="images/blue-eryngo-7319904_1280.jpg" class="img-fluid" />
        </div>

        <div class="col-md-3">
          <img src="images/art-2578353_1280.jpg" class="img-fluid" />
        </div>
      </div>

      <!-- SEE MORE BUTTON -->
      <div class="text-center mt-4">
        <button class="btn btn-primary">See More</button>
      </div>
    </div>

    <!-- ABOUT SECTION -->
    <div class="container text-center mt-4 mb-4">
      <h5>About the Artist</h5>

      <p class="text-muted">
        Capturing moments through lenses inspires imagination in every frame.
      </p>

      <!-- Reverse hover button -->
      <button class="btn btn-outline-dark">Contact</button>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
