<!-- Change the background color of the body based on mobile = orange, tablet = blue, and desktop = gray size using tailwind utility classes. -->

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hi</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-orange-500 md:bg-blue-500 lg:bg-gray-500">
    <p>hi</p>
  </body>
</html>
