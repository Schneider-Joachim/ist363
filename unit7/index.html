<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JScript</title>
  </head>
  <body>
    <script>
      for (let i = 1; i <= 10; i++) {
        if (i % 2 === 0) {
          console.log(i);
        }
      }
    </script>
    <button onclick="alert('Even numbers printed to console')">Click Me</button>
  </body>
</html>
