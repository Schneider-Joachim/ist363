<!doctype html>
<html>
  <body>
    <h2>Dog Years Calculator</h2>

    <form>
      Enter human years:
      <input type="number" name="years" />
      <button type="button" class="calc">Calculate</button>
    </form>

    <p>Dog years: <span class="result"></span></p>

    <script>
      let button = document.querySelector(".calc");
      let input = document.querySelector("input");
      let result = document.querySelector(".result");

      button.addEventListener("click", function () {
        let humanYears = input.value;
        let dogYears = humanYears * 7;

        result.innerText = dogYears;
      });
    </script>
  </body>
</html>
